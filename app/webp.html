<!doctype html>
<html lang="pt-BR" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor WebP</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=DM+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    * { font-family: 'DM Sans', sans-serif; }
    h1, h2, h3, .font-heading { font-family: 'Space Grotesk', sans-serif; }
    
    .drop-zone {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.05) 0%, rgba(168, 85, 247, 0.05) 100%);
      border: 2px dashed rgba(99, 102, 241, 0.4);
      transition: all 0.3s ease;
    }
    
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #6366f1;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(168, 85, 247, 0.1) 100%);
      transform: scale(1.01);
    }
    
    .image-card {
      animation: slideIn 0.3s ease-out forwards;
      opacity: 0;
      transform: translateY(10px);
    }
    
    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .progress-bar {
      background: linear-gradient(90deg, #6366f1, #a855f7, #6366f1);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
    }
    
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    .quality-slider::-webkit-slider-thumb {
      appearance: none;
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(99, 102, 241, 0.4);
    }
    
    .quality-slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 50%;
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 6px rgba(99, 102, 241, 0.4);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      transition: all 0.3s ease;
    }
    
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
    }
    
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .savings-badge {
      background: linear-gradient(135deg, #10b981, #059669);
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full bg-slate-950 text-white overflow-auto">
  <div id="app-wrapper" class="w-full min-h-full bg-slate-950"><!-- Background Pattern -->
   <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-purple-600/10 rounded-full blur-3xl"></div>
   </div>
   <div class="relative z-10 max-w-5xl mx-auto px-4 py-8"><!-- Header -->
    <header class="text-center mb-8">
     <div class="inline-flex items-center gap-3 mb-4">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
       <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
       </svg>
      </div>
      <h1 id="app-title" class="font-heading text-3xl md:text-4xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Conversor WebP</h1>
     </div>
     <p id="subtitle" class="text-slate-400 text-lg">Converta suas imagens JPG/PNG para WebP com alta qualidade e compressão otimizada</p>
    </header><!-- Quality Control -->
    <div class="bg-slate-900/80 backdrop-blur-sm rounded-2xl p-6 mb-6 border border-slate-800">
     <div class="flex flex-col md:flex-row md:items-center gap-4 md:gap-8">
      <div class="flex-1"><label class="block text-sm font-medium text-slate-300 mb-2"> Qualidade da Compressão: <span id="quality-value" class="text-indigo-400 font-semibold">85%</span> </label> <input type="range" id="quality-slider" min="50" max="100" value="85" class="quality-slider w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
       <div class="flex justify-between text-xs text-slate-500 mt-1"><span>Menor tamanho</span> <span>Maior qualidade</span>
       </div>
      </div>
      <div class="text-center md:text-right">
       <div class="text-xs text-slate-500 uppercase tracking-wider mb-1">
        Limite
       </div>
       <div class="text-2xl font-bold text-indigo-400">
        15
       </div>
       <div class="text-xs text-slate-500">
        imagens por vez
       </div>
      </div>
     </div>
    </div><!-- Drop Zone -->
    <div id="drop-zone" class="drop-zone rounded-2xl p-8 md:p-12 text-center cursor-pointer mb-6"><input type="file" id="file-input" accept="image/jpeg,image/png,image/jpg" multiple class="hidden">
     <div class="pointer-events-none">
      <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-indigo-500/20 flex items-center justify-center">
       <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
       </svg>
      </div>
      <h3 class="text-xl font-semibold text-white mb-2">Arraste suas imagens aqui</h3>
      <p class="text-slate-400 mb-4">ou clique para selecionar</p>
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-slate-800/80 text-sm text-slate-300">
       <svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
       </svg> Aceita JPG e PNG • Máximo 15 arquivos
      </div>
     </div>
    </div><!-- Image List -->
    <div id="image-list" class="space-y-3 mb-6"></div><!-- Actions -->
    <div id="actions-bar" class="hidden bg-slate-900/80 backdrop-blur-sm rounded-2xl p-4 border border-slate-800 sticky bottom-4">
     <div class="flex flex-col sm:flex-row items-center gap-4">
      <div class="flex-1 text-center sm:text-left"><span id="selected-count" class="text-slate-300">0 imagens selecionadas</span> <span id="total-savings" class="hidden ml-3 text-emerald-400 font-medium"></span>
      </div>
      <div class="flex gap-3"><button id="clear-btn" class="px-5 py-2.5 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors font-medium"> Limpar </button> <button id="convert-btn" class="btn-primary px-6 py-2.5 rounded-xl text-white font-semibold flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg> Converter Todas </button> <button id="download-all-btn" class="hidden btn-primary px-6 py-2.5 rounded-xl text-white font-semibold flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg> Baixar Todas </button>
      </div>
     </div>
    </div><!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50"></div>
   </div>
  </div>
  <script>
    // State
    let images = [];
    let quality = 85;
    const MAX_IMAGES = 15;
    
    // Default config
    const defaultConfig = {
      app_title: 'Conversor WebP',
      subtitle_text: 'Converta suas imagens JPG/PNG para WebP com alta qualidade e compressão otimizada',
      primary_color: '#6366f1',
      secondary_color: '#a855f7',
      background_color: '#020617',
      surface_color: '#0f172a',
      text_color: '#e2e8f0'
    };
    
    // Elements
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const qualitySlider = document.getElementById('quality-slider');
    const qualityValue = document.getElementById('quality-value');
    const imageList = document.getElementById('image-list');
    const actionsBar = document.getElementById('actions-bar');
    const selectedCount = document.getElementById('selected-count');
    const totalSavings = document.getElementById('total-savings');
    const convertBtn = document.getElementById('convert-btn');
    const downloadAllBtn = document.getElementById('download-all-btn');
    const clearBtn = document.getElementById('clear-btn');
    
    // Initialize Element SDK
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => {
          document.getElementById('app-title').textContent = config.app_title || defaultConfig.app_title;
          document.getElementById('subtitle').textContent = config.subtitle_text || defaultConfig.subtitle_text;
        },
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.background_color || defaultConfig.background_color,
              set: (v) => window.elementSdk.setConfig({ background_color: v })
            },
            {
              get: () => config.surface_color || defaultConfig.surface_color,
              set: (v) => window.elementSdk.setConfig({ surface_color: v })
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (v) => window.elementSdk.setConfig({ text_color: v })
            },
            {
              get: () => config.primary_color || defaultConfig.primary_color,
              set: (v) => window.elementSdk.setConfig({ primary_color: v })
            },
            {
              get: () => config.secondary_color || defaultConfig.secondary_color,
              set: (v) => window.elementSdk.setConfig({ secondary_color: v })
            }
          ],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ['app_title', config.app_title || defaultConfig.app_title],
          ['subtitle_text', config.subtitle_text || defaultConfig.subtitle_text]
        ])
      });
    }
    
    // Event Listeners
    dropZone.addEventListener('click', () => fileInput.click());
    
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });
    
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });
    
    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
      fileInput.value = '';
    });
    
    qualitySlider.addEventListener('input', (e) => {
      quality = parseInt(e.target.value);
      qualityValue.textContent = `${quality}%`;
    });
    
    convertBtn.addEventListener('click', convertAllImages);
    downloadAllBtn.addEventListener('click', downloadAllImages);
    clearBtn.addEventListener('click', clearAllImages);
    
    // Handle Files
    function handleFiles(files) {
      const validFiles = Array.from(files).filter(f => 
        f.type === 'image/jpeg' || f.type === 'image/png' || f.type === 'image/jpg'
      );
      
      if (validFiles.length === 0) {
        showToast('Selecione apenas arquivos JPG ou PNG', 'error');
        return;
      }
      
      const remaining = MAX_IMAGES - images.length;
      if (remaining <= 0) {
        showToast(`Limite de ${MAX_IMAGES} imagens atingido`, 'error');
        return;
      }
      
      const filesToAdd = validFiles.slice(0, remaining);
      if (filesToAdd.length < validFiles.length) {
        showToast(`Apenas ${filesToAdd.length} imagens adicionadas (limite: ${MAX_IMAGES})`, 'warning');
      }
      
      filesToAdd.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const id = Date.now() + index;
          images.push({
            id,
            file,
            name: file.name,
            originalSize: file.size,
            dataUrl: e.target.result,
            converted: false,
            convertedBlob: null,
            convertedSize: 0
          });
          renderImages();
          updateUI();
        };
        reader.readAsDataURL(file);
      });
    }
    
    // Render Images
    function renderImages() {
      imageList.innerHTML = '';
      
      images.forEach((img, index) => {
        const card = document.createElement('div');
        card.className = 'image-card bg-slate-900/80 backdrop-blur-sm rounded-xl p-4 border border-slate-800';
        card.style.animationDelay = `${index * 0.05}s`;
        
        const savings = img.converted ? Math.round((1 - img.convertedSize / img.originalSize) * 100) : 0;
        
        card.innerHTML = `
          <div class="flex items-center gap-4">
            <div class="w-16 h-16 rounded-lg overflow-hidden bg-slate-800 flex-shrink-0">
              <img src="${img.dataUrl}" alt="${img.name}" class="w-full h-full object-cover">
            </div>
            <div class="flex-1 min-w-0">
              <h4 class="font-medium text-white truncate">${img.name.replace(/\.[^/.]+$/, '')}.webp</h4>
              <div class="flex items-center gap-3 mt-1">
                <span class="text-sm text-slate-400">${formatSize(img.originalSize)}</span>
                ${img.converted ? `
                  <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                  </svg>
                  <span class="text-sm text-emerald-400 font-medium">${formatSize(img.convertedSize)}</span>
                  <span class="savings-badge text-xs px-2 py-0.5 rounded-full text-white font-medium">-${savings}%</span>
                ` : `
                  <span class="text-xs text-slate-500">Aguardando conversão</span>
                `}
              </div>
              ${img.converting ? `
                <div class="mt-2 h-1.5 bg-slate-700 rounded-full overflow-hidden">
                  <div class="progress-bar h-full rounded-full" style="width: 100%"></div>
                </div>
              ` : ''}
            </div>
            <div class="flex items-center gap-2">
              ${img.converted ? `
                <button onclick="downloadImage(${img.id})" class="p-2 rounded-lg bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500/30 transition-colors" title="Baixar">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                  </svg>
                </button>
              ` : ''}
              <button onclick="removeImage(${img.id})" class="p-2 rounded-lg bg-slate-800 text-slate-400 hover:bg-red-500/20 hover:text-red-400 transition-colors" title="Remover">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
              </button>
            </div>
          </div>
        `;
        
        imageList.appendChild(card);
      });
    }
    
    // Update UI
    function updateUI() {
      const hasImages = images.length > 0;
      const allConverted = images.length > 0 && images.every(img => img.converted);
      
      actionsBar.classList.toggle('hidden', !hasImages);
      selectedCount.textContent = `${images.length} ${images.length === 1 ? 'imagem selecionada' : 'imagens selecionadas'}`;
      
      convertBtn.classList.toggle('hidden', allConverted);
      downloadAllBtn.classList.toggle('hidden', !allConverted);
      
      if (allConverted && images.length > 0) {
        const totalOriginal = images.reduce((sum, img) => sum + img.originalSize, 0);
        const totalConverted = images.reduce((sum, img) => sum + img.convertedSize, 0);
        const savingsPercent = Math.round((1 - totalConverted / totalOriginal) * 100);
        totalSavings.textContent = `Economia total: ${savingsPercent}%`;
        totalSavings.classList.remove('hidden');
      } else {
        totalSavings.classList.add('hidden');
      }
    }
    
    // Convert Image to WebP
    async function convertToWebP(imageData) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          
          canvas.toBlob(
            (blob) => resolve(blob),
            'image/webp',
            quality / 100
          );
        };
        img.src = imageData;
      });
    }
    
    // Convert All Images
    async function convertAllImages() {
      convertBtn.disabled = true;
      convertBtn.innerHTML = `
        <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Convertendo...
      `;
      
      for (let i = 0; i < images.length; i++) {
        if (!images[i].converted) {
          images[i].converting = true;
          renderImages();
          
          const blob = await convertToWebP(images[i].dataUrl);
          images[i].convertedBlob = blob;
          images[i].convertedSize = blob.size;
          images[i].converted = true;
          images[i].converting = false;
          
          renderImages();
        }
      }
      
      convertBtn.disabled = false;
      convertBtn.innerHTML = `
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Converter Todas
      `;
      
      updateUI();
      showToast('Todas as imagens foram convertidas!', 'success');
    }
    
    // Download Single Image
    function downloadImage(id) {
      const img = images.find(i => i.id === id);
      if (img && img.convertedBlob) {
        const url = URL.createObjectURL(img.convertedBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = img.name.replace(/\.[^/.]+$/, '') + '.webp';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }
    }
    
    // Download All Images
    function downloadAllImages() {
      images.forEach((img, index) => {
        if (img.convertedBlob) {
          setTimeout(() => downloadImage(img.id), index * 200);
        }
      });
      showToast('Baixando todas as imagens...', 'success');
    }
    
    // Remove Image
    function removeImage(id) {
      images = images.filter(img => img.id !== id);
      renderImages();
      updateUI();
    }
    
    // Clear All Images
    function clearAllImages() {
      images = [];
      renderImages();
      updateUI();
    }
    
    // Format Size
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }
    
    // Show Toast
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const colors = {
        success: 'bg-emerald-500',
        error: 'bg-red-500',
        warning: 'bg-amber-500',
        info: 'bg-indigo-500'
      };
      
      const icons = {
        success: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>',
        error: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>',
        warning: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>',
        info: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>'
      };
      
      toast.className = `${colors[type]} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 animate-pulse`;
      toast.innerHTML = `
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          ${icons[type]}
        </svg>
        <span class="font-medium">${message}</span>
      `;
      
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
