<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Moldura Festa net Brasil</title>
    <link rel="icon" type="image/png" href="./img/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            box-sizing: border-box;
        }
        
        .frame {
            width: 1984px;
            height: 130px;
            transform: scale(0.5);
            transform-origin: center;
            margin: -65px 0;
        }
        
        .frame-title {
            font-size: 36px;
            line-height: 1.1;
        }
        
        .frame-subtitle {
            font-size: 24px;
            line-height: 1.2;
        }
        
        .frame-date {
            font-size: 20px;
            line-height: 1.2;
        }
        
        @media (max-width: 1200px) {
            .frame {
                transform: scale(0.4);
                margin: -78px 0;
            }
        }
        
        @media (max-width: 800px) {
            .frame {
                transform: scale(0.3);
                margin: -91px 0;
            }
        }
    </style>
</head>
<body class="bg-gray-100 p-5">
    <div class="max-w-6xl mx-auto bg-white rounded-xl p-8 shadow-xl">
        <div class="text-center mb-8">
            <img src="./img/logo.webp" alt="Logo Festa net Brasil" class="mx-auto mb-4 h-16" onerror="this.style.display='none';">
            <h1 class="text-gray-800 text-3xl font-bold mb-2">Gerador de Moldura Festa net Brasil</h1>
            <p class="text-gray-600 text-lg">Gere sua moldura personalizada agora.</p>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
            <div class="flex flex-col">
                <label for="titulo" class="font-semibold mb-2 text-gray-700 text-sm">Título *</label>
                <input type="text" id="titulo" placeholder="Digite o título" value="Título Principal" 
                       class="p-3 border-2 border-gray-200 rounded-lg text-base focus:outline-none focus:border-indigo-500 transition-colors">
            </div>
            
            <div class="flex flex-col">
                <label for="subtitulo" class="font-semibold mb-2 text-gray-700 text-sm">Subtítulo (opcional)</label>
                <input type="text" id="subtitulo" placeholder="Digite o subtítulo"
                       class="p-3 border-2 border-gray-200 rounded-lg text-base focus:outline-none focus:border-indigo-500 transition-colors">
            </div>
            
            <div class="flex flex-col">
                <label for="data" class="font-semibold mb-2 text-gray-700 text-sm">Data (opcional)</label>
                <input type="text" id="data" placeholder="Digite a data"
                       class="p-3 border-2 border-gray-200 rounded-lg text-base focus:outline-none focus:border-indigo-500 transition-colors">
            </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="flex flex-col">
                <label for="cor" class="font-semibold mb-2 text-gray-700 text-sm">Cor de Fundo</label>
                <input type="color" id="cor" value="#ffffff" 
                       class="w-16 h-12 border-2 border-gray-200 rounded-lg cursor-pointer">
            </div>
            
            <div class="flex flex-col">
                <label for="corTexto" class="font-semibold mb-2 text-gray-700 text-sm">Cor dos Textos</label>
                <input type="color" id="corTexto" value="#1a1a1a" 
                       class="w-16 h-12 border-2 border-gray-200 rounded-lg cursor-pointer">
            </div>
            
            <div class="flex flex-col">
                <label class="font-semibold mb-2 text-gray-700 text-sm">Opções de Texto</label>
                <div class="flex items-center">
                    <input type="checkbox" id="maiuscula" class="mr-2 w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500">
                    <label for="maiuscula" class="text-gray-700 text-sm">Exibir em MAIÚSCULAS</label>
                </div>
            </div>
        </div>
        
        <div class="flex justify-center my-8">
            <div class="frame bg-white border border-gray-300 flex flex-col justify-center pl-10 box-border" id="moldura">
                <div class="frame-title font-bold text-gray-900 m-0" id="tituloFrame">Título Principal</div>
                <div class="frame-subtitle font-normal text-gray-600 mt-1 m-0" id="subtituloFrame" style="display: none;"></div>
                <div class="frame-date font-normal text-gray-500 mt-1 m-0" id="dataFrame" style="display: none;"></div>
            </div>
        </div>
        
        <div class="text-center">
            <button onclick="baixarMoldura()" 
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-lg text-base transition-colors mt-5">
                Baixar Moldura
            </button>
        </div>
    </div>
    
    <footer class="bg-gray-800 text-white py-8 mt-12">
        <div class="max-w-6xl mx-auto px-8 text-center">
            <h3 class="text-xl font-bold mb-2">
                <a href="https://digital.sou.net.br/" target="_blank" rel="noopener noreferrer" class="hover:text-indigo-400 transition-colors">
                    JN2M3A DIGITAL
                </a>
            </h3>
            <p class="text-gray-300 mb-2">Uma marca do Grupo Foto de Marca</p>
            <p class="text-gray-300 mb-4">WhatsApp (79) 99896-5081</p>
            <p class="text-gray-400 text-sm">© 2025 JN2M3A DIGITAL. Desenvolvendo soluções que facilitam o seu dia a dia.</p>
        </div>
    </footer>

    <script>
        const titulo = document.getElementById('titulo');
        const subtitulo = document.getElementById('subtitulo');
        const data = document.getElementById('data');
        const cor = document.getElementById('cor');
        const corTexto = document.getElementById('corTexto');
        const maiuscula = document.getElementById('maiuscula');
        const moldura = document.getElementById('moldura');
        const tituloFrame = document.getElementById('tituloFrame');
        const subtituloFrame = document.getElementById('subtituloFrame');
        const dataFrame = document.getElementById('dataFrame');

        function atualizarMoldura() {
            const usarMaiuscula = maiuscula.checked;
            
            // Atualizar título
            const textoTitulo = titulo.value || 'Título Principal';
            tituloFrame.textContent = usarMaiuscula ? textoTitulo.toUpperCase() : textoTitulo;
            
            // Atualizar cor de fundo
            moldura.style.backgroundColor = cor.value;
            
            // Atualizar cor dos textos
            tituloFrame.style.color = corTexto.value;
            subtituloFrame.style.color = corTexto.value;
            dataFrame.style.color = corTexto.value;
            
            // Verificar se subtítulo existe
            const temSubtitulo = subtitulo.value.trim() !== '';
            const temData = data.value.trim() !== '';
            
            if (temSubtitulo) {
                const textoSubtitulo = subtitulo.value;
                subtituloFrame.textContent = usarMaiuscula ? textoSubtitulo.toUpperCase() : textoSubtitulo;
                subtituloFrame.style.display = 'block';
            } else {
                subtituloFrame.style.display = 'none';
            }
            
            if (temData) {
                const textoData = data.value;
                dataFrame.textContent = usarMaiuscula ? textoData.toUpperCase() : textoData;
                dataFrame.style.display = 'block';
            } else {
                dataFrame.style.display = 'none';
            }
            
            // Ajustar posicionamento vertical baseado no conteúdo
            if (!temSubtitulo && !temData) {
                // Só título - centralizar
                moldura.style.justifyContent = 'center';
            } else if (temSubtitulo && temData) {
                // Todos os elementos - distribuir
                moldura.style.justifyContent = 'center';
            } else {
                // Dois elementos - ajustar como sanduíche
                moldura.style.justifyContent = 'center';
            }
        }

        // Event listeners
        titulo.addEventListener('input', atualizarMoldura);
        subtitulo.addEventListener('input', atualizarMoldura);
        data.addEventListener('input', atualizarMoldura);
        cor.addEventListener('input', atualizarMoldura);
        corTexto.addEventListener('input', atualizarMoldura);
        maiuscula.addEventListener('change', atualizarMoldura);

        function baixarMoldura() {
            // Criar canvas
            const canvas = document.createElement('canvas');
            canvas.width = 1984;
            canvas.height = 130;
            const ctx = canvas.getContext('2d');
            
            // Preencher fundo
            ctx.fillStyle = cor.value;
            ctx.fillRect(0, 0, 1984, 130);
            
            // Configurar fonte
            ctx.fillStyle = corTexto.value;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            
            const usarMaiuscula = maiuscula.checked;
            const temSubtitulo = subtitulo.value.trim() !== '';
            const temData = data.value.trim() !== '';
            
            let yPosition = 40; // Posição inicial
            
            // Calcular posicionamento vertical
            const totalElements = 1 + (temSubtitulo ? 1 : 0) + (temData ? 1 : 0);
            if (totalElements === 1) {
                yPosition = 47; // Centralizar título
            } else if (totalElements === 2) {
                yPosition = 35; // Ajuste para dois elementos
            } else {
                yPosition = 25; // Ajuste para três elementos
            }
            
            // Desenhar título
            ctx.font = 'bold 36px Inter, sans-serif';
            const textoTitulo = titulo.value || 'Título Principal';
            ctx.fillText(usarMaiuscula ? textoTitulo.toUpperCase() : textoTitulo, 40, yPosition);
            yPosition += 40;
            
            // Desenhar subtítulo se existir
            if (temSubtitulo) {
                ctx.font = '400 24px Inter, sans-serif';
                ctx.fillStyle = corTexto.value;
                const textoSubtitulo = subtitulo.value;
                ctx.fillText(usarMaiuscula ? textoSubtitulo.toUpperCase() : textoSubtitulo, 40, yPosition);
                yPosition += 28;
            }
            
            // Desenhar data se existir
            if (temData) {
                ctx.font = '400 20px Inter, sans-serif';
                ctx.fillStyle = corTexto.value;
                const textoData = data.value;
                ctx.fillText(usarMaiuscula ? textoData.toUpperCase() : textoData, 40, yPosition);
            }
            
            // Baixar imagem
            const link = document.createElement('a');
            link.download = 'moldura.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        // Inicializar
        atualizarMoldura();
    </script>

</html>
