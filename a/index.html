<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizador - Diagnóstico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .debug { background: #1e293b; color: #4ade80; font-family: monospace; font-size: 11px; padding: 10px; border-radius: 8px; margin-bottom: 10px; max-height: 200px; overflow-y: auto; }
        .error { color: #f87171; }
        .success { color: #4ade80; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-2xl mx-auto">
        <!-- LOG DE DEBUG -->
        <div id="log" class="debug">Iniciando diagnóstico...</div>

        <div class="bg-white rounded-2xl shadow-lg p-6 space-y-4">
            <h1 class="text-xl font-bold text-center">Personalizador</h1>
            
            <div class="grid grid-cols-2 gap-3">
                <div id="boxNative" class="bg-slate-100 p-3 rounded-lg text-center text-sm">
                    <div class="loader inline-block w-4 h-4 border-2 border-slate-300 border-t-blue-500 rounded-full animate-spin"></div>
                    <p class="font-bold mt-1">Marca</p>
                </div>
                <div id="boxMoldura" class="bg-slate-100 p-3 rounded-lg text-center text-sm">
                    <div class="loader inline-block w-4 h-4 border-2 border-slate-300 border-t-purple-500 rounded-full animate-spin"></div>
                    <p class="font-bold mt-1">Moldura</p>
                </div>
            </div>

            <input type="file" id="images" accept="image/*" multiple class="hidden">
            <label for="images" class="block w-full p-4 border-2 border-dashed border-slate-300 rounded-xl text-center cursor-pointer hover:bg-slate-50">
                <span id="fileLabel">Selecionar fotos</span>
            </label>

            <div id="preview" class="hidden aspect-video bg-slate-900 rounded-lg overflow-hidden">
                <canvas id="canvas" class="w-full h-full object-contain"></canvas>
            </div>

            <button id="btn" disabled class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl disabled:bg-slate-300">
                PROCESSAR
            </button>
        </div>
    </div>

    <script>
        const log = document.getElementById('log');
        const addLog = (msg, type='info') => {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
            console.log(msg);
        };

        addLog('URL: ' + location.href);
        addLog('Pathname: ' + location.pathname);

        // Testar múltiplos caminhos
        const testarCaminhos = async (nome, extensoes) => {
            const caminhos = [
                `./${nome}.${extensoes[0]}`,
                `${nome}.${extensoes[0]}`,
                `/${nome}.${extensoes[0]}`,
                `${location.pathname}${nome}.${extensoes[0]}`,
                `../${nome}.${extensoes[0]}`,
                `${location.origin}/${nome}.${extensoes[0]}`,
                `${location.origin}${location.pathname}${nome}.${extensoes[0]}`
            ];

            for (let url of caminhos) {
                addLog(`Testando: ${url}`);
                try {
                    const img = await new Promise((resolve, reject) => {
                        const i = new Image();
                        i.onload = () => resolve(i);
                        i.onerror = () => reject(new Error('fail'));
                        i.src = url + '?t=' + Date.now();
                    });
                    addLog(`✅ SUCESSO: ${url} (${img.width}x${img.height})`, 'success');
                    return { img, url };
                } catch (e) {
                    addLog(`❌ Falha: ${url}`, 'error');
                }
            }
            throw new Error('Todos os caminhos falharam');
        };

        let nativeImg = null;
        let molduraImg = null;

        const init = async () => {
            try {
                const native = await testarCaminhos('native', ['webp', 'png', 'jpg']);
                nativeImg = native.img;
                document.getElementById('boxNative').className = 'bg-green-100 p-3 rounded-lg text-center text-sm border border-green-300';
                document.getElementById('boxNative').innerHTML = `<p class="text-green-700 font-bold">✅ Marca</p><p class="text-xs text-green-600">${nativeImg.width}x${nativeImg.height}</p><p class="text-[10px] text-green-500">${native.url}</p>`;
            } catch (e) {
                document.getElementById('boxNative').className = 'bg-red-100 p-3 rounded-lg text-center text-sm border border-red-300';
                document.getElementById('boxNative').innerHTML = `<p class="text-red-700 font-bold">❌ Erro Marca</p>`;
            }

            try {
                const moldura = await testarCaminhos('moldura', ['png', 'webp', 'jpg']);
                molduraImg = moldura.img;
                document.getElementById('boxMoldura').className = 'bg-purple-100 p-3 rounded-lg text-center text-sm border border-purple-300';
                document.getElementById('boxMoldura').innerHTML = `<p class="text-purple-700 font-bold">✅ Moldura</p><p class="text-xs text-purple-600">${molduraImg.width}x${molduraImg.height}</p><p class="text-[10px] text-purple-500">${moldura.url}</p>`;
            } catch (e) {
                document.getElementById('boxMoldura').className = 'bg-red-100 p-3 rounded-lg text-center text-sm border border-red-300';
                document.getElementById('boxMoldura').innerHTML = `<p class="text-red-700 font-bold">❌ Erro Moldura</p>`;
            }

            // Resto da lógica...
            const fileInput = document.getElementById('images');
            const fileLabel = document.getElementById('fileLabel');
            const btn = document.getElementById('btn');
            const preview = document.getElementById('preview');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            const processar = (img) => {
                canvas.width = 1984;
                canvas.height = 1100;
                
                // Fundo preto
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, 1984, 1100);
                
                // Foto (cover)
                const scale = Math.max(1984/img.width, 1100/img.height);
                const w = img.width * scale;
                const h = img.height * scale;
                ctx.drawImage(img, (1984-w)/2, (1100-h)/2, w, h);
                
                // Moldura (bottom)
                if (molduraImg) {
                    ctx.drawImage(molduraImg, (1984-molduraImg.width)/2, 1100-molduraImg.height);
                }
                
                // Marca (centro)
                if (nativeImg) {
                    ctx.drawImage(nativeImg, (1984-nativeImg.width)/2, (1100-nativeImg.height)/2);
                }
            };

            fileInput.addEventListener('change', async (e) => {
                const files = e.target.files;
                fileLabel.textContent = files.length + ' arquivo(s)';
                
                if (files[0] && (nativeImg || molduraImg)) {
                    const url = URL.createObjectURL(files[0]);
                    const img = await new Promise(r => { const i=new Image(); i.onload=()=>r(i); i.src=url; });
                    processar(img);
                    preview.classList.remove('hidden');
                    btn.disabled = false;
                    URL.revokeObjectURL(url);
                }
            });

            btn.addEventListener('click', async () => {
                const files = Array.from(fileInput.files);
                for (let i=0; i<files.length; i++) {
                    const url = URL.createObjectURL(files[i]);
                    const img = await new Promise(r => { const i=new Image(); i.onload=()=>r(i); i.src=url; });
                    processar(img);
                    
                    const link = document.createElement('a');
                    link.download = `Foto_${Date.now()}_${i+1}.jpg`;
                    link.href = canvas.toDataURL('image/jpeg', 0.38);
                    link.click();
                    
                    await new Promise(r => setTimeout(r, 300));
                }
                alert('Concluído!');
            });
        };

        init();
    </script>
</body>
</html>
