<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personalizador | Debug</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .custom-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
        .view-wrapper { width: 100%; aspect-ratio: 1984 / 1100; background-color: #1e293b; border-radius: 12px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
        #progressView canvas { display: block; width: 100% !important; height: auto !important; object-fit: contain; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .debug-box { font-family: monospace; font-size: 10px; background: #1e293b; color: #4ade80; padding: 10px; border-radius: 8px; overflow-x: auto; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-10">

    <!-- DEBUG INFO -->
    <div class="w-full max-w-2xl mb-4 debug-box" id="debugInfo">
        Verificando arquivos...
    </div>

    <div class="w-full max-w-2xl bg-white rounded-3xl custom-shadow overflow-hidden border border-slate-100">
        <header class="p-6 border-b flex flex-col items-center bg-white">
            <h1 class="text-xl font-bold text-slate-800">Personalizador de Fotos</h1>
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">DEBUG MODE</p>
        </header>

        <main class="p-6 md:p-8 space-y-8">
            
            <!-- Status -->
            <div class="grid grid-cols-2 gap-4">
                <div id="statusNative" class="bg-slate-50 rounded-xl p-3 flex items-center space-x-3 border border-slate-200">
                    <div class="loader !w-4 !h-4 !border-slate-300 !border-t-blue-500"></div>
                    <div class="text-xs">
                        <p class="font-bold text-slate-700">Marca Nativa</p>
                        <p class="text-slate-500" id="textNative">Carregando...</p>
                    </div>
                </div>
                <div id="statusMoldura" class="bg-slate-50 rounded-xl p-3 flex items-center space-x-3 border border-slate-200">
                    <div class="loader !w-4 !h-4 !border-slate-300 !border-t-purple-500"></div>
                    <div class="text-xs">
                        <p class="font-bold text-slate-700">Moldura</p>
                        <p class="text-slate-500" id="textMoldura">Carregando...</p>
                    </div>
                </div>
            </div>

            <!-- Upload -->
            <div class="space-y-2">
                <label class="text-[11px] font-bold text-slate-500 uppercase ml-1">Fotos para Personalizar</label>
                <label for="images" class="flex flex-col items-center justify-center p-4 border-2 border-dashed border-slate-300 rounded-2xl cursor-pointer h-32 hover:bg-slate-50 transition-colors">
                    <i data-lucide="image-plus" class="w-8 h-8 text-blue-500 mb-2"></i>
                    <span id="imagesPreviewText" class="text-xs font-bold text-slate-600 text-center">Selecionar Fotos</span>
                    <input type="file" id="images" class="hidden" accept="image/*" multiple>
                </label>
            </div>

            <!-- Preview -->
            <div id="previewArea" class="hidden space-y-3">
                <div class="flex justify-between items-center px-1">
                    <span class="text-[11px] font-bold text-slate-500 uppercase">Preview</span>
                    <span class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-md font-bold">~120 KB</span>
                </div>
                <div id="progressView" class="view-wrapper"></div>
            </div>

            <button id="convertButton" disabled class="w-full bg-slate-900 text-white font-bold py-5 rounded-2xl shadow-xl transition-all disabled:bg-slate-300">
                PROCESSAR E COMPRIMIR
            </button>
        </main>
    </div>

    <script>
        lucide.createIcons();

        const debugEl = document.getElementById('debugInfo');
        const log = (msg) => {
            console.log(msg);
            debugEl.innerHTML += '<br>' + msg;
        };

        document.addEventListener("DOMContentLoaded", async () => {
            const imageInput = document.getElementById('images');
            const progressView = document.getElementById('progressView');
            const previewArea = document.getElementById('previewArea');
            const imagesPreviewText = document.getElementById('imagesPreviewText');
            const convertButton = document.getElementById('convertButton');
            const textNative = document.getElementById('textNative');
            const textMoldura = document.getElementById('textMoldura');

            // DEBUG: Mostra URL atual
            log('URL atual: ' + window.location.href);
            log('Path: ' + window.location.pathname);
            log('Origin: ' + window.location.origin);

            // Tenta diferentes caminhos
            const tentativas = [
                './native.webp',
                'native.webp',
                '/native.webp',
                window.location.pathname.replace(/\/[^\/]*$/, '/') + 'native.webp'
            ];

            const tentativasMoldura = [
                './moldura.png',
                'moldura.png', 
                '/moldura.png',
                window.location.pathname.replace(/\/[^\/]*$/, '/') + 'moldura.png'
            ];

            log('Tentativas marca: ' + JSON.stringify(tentativas));
            log('Tentativas moldura: ' + JSON.stringify(tentativasMoldura));

            let nativeImg = null;
            let molduraImg = null;

            // Função de carga com retry
            const loadWithRetry = async (urls, name) => {
                for (let url of urls) {
                    try {
                        log(`Tentando ${name}: ${url}`);
                        const img = await new Promise((resolve, reject) => {
                            const i = new Image();
                            i.onload = () => {
                                log(`✅ SUCESSO ${name}: ${url} (${i.width}x${i.height})`);
                                resolve(i);
                            };
                            i.onerror = () => {
                                log(`❌ FALHA ${name}: ${url}`);
                                reject(new Error('fail'));
                            };
                            i.src = url + '?t=' + Date.now();
                        });
                        return img;
                    } catch (e) {
                        continue;
                    }
                }
                throw new Error(`Todas as tentativas falharam para ${name}`);
            };

            try {
                nativeImg = await loadWithRetry(tentativas, 'MARCA');
                document.getElementById('statusNative').className = 'bg-blue-50 rounded-xl p-3 flex items-center space-x-3 border border-blue-200';
                textNative.textContent = `${nativeImg.width}×${nativeImg.height}px`;
            } catch (e) {
                log('❌ ERRO FINAL MARCA: ' + e.message);
                document.getElementById('statusNative').className = 'bg-red-50 rounded-xl p-3 border border-red-200';
                textNative.textContent = 'Não encontrado';
                textNative.className = 'text-red-600 font-bold';
            }

            try {
                molduraImg = await loadWithRetry(tentativasMoldura, 'MOLDURA');
                document.getElementById('statusMoldura').className = 'bg-purple-50 rounded-xl p-3 flex items-center space-x-3 border border-purple-200';
                textMoldura.textContent = `${molduraImg.width}×${molduraImg.height}px`;
            } catch (e) {
                log('❌ ERRO FINAL MOLDURA: ' + e.message);
                document.getElementById('statusMoldura').className = 'bg-red-50 rounded-xl p-3 border border-red-200';
                textMoldura.textContent = 'Não encontrado';
                textMoldura.className = 'text-red-600 font-bold';
            }

            const assetsLoaded = nativeImg && molduraImg;
            log('Assets loaded: ' + assetsLoaded);

            // Resto do código...
            const processImage = (image, nativeWatermark, userWatermark) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const targetWidth = 1984;
                const targetHeight = 1100;
                canvas.width = targetWidth;
                canvas.height = targetHeight;

                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';

                const imgRatio = image.width / image.height;
                const targetRatio = targetWidth / targetHeight;
                let newWidth, newHeight;

                if (imgRatio > targetRatio) {
                    newWidth = image.width / (image.height / targetHeight);
                    newHeight = targetHeight;
                } else {
                    newWidth = targetWidth;
                    newHeight = image.height / (image.width / targetWidth);
                }
                
                ctx.drawImage(image, (targetWidth - newWidth) / 2, (targetHeight - newHeight) / 2, newWidth, newHeight);

                if (userWatermark) {
                    ctx.drawImage(userWatermark, (targetWidth - userWatermark.width) / 2, targetHeight - userWatermark.height);
                }

                if (nativeWatermark) {
                    ctx.drawImage(nativeWatermark, (targetWidth - nativeWatermark.width) / 2, (targetHeight - nativeWatermark.height) / 2);
                }

                return canvas;
            };

            const refreshPreview = async () => {
                if (!assetsLoaded || imageInput.files.length === 0) {
                    previewArea.classList.add('hidden');
                    return;
                }
                try {
                    previewArea.classList.remove('hidden');
                    progressView.innerHTML = '<div class="loader"></div>';
                    const imgUrl = URL.createObjectURL(imageInput.files[0]);
                    const img = await new Promise((resolve, reject) => {
                        const i = new Image();
                        i.onload = () => resolve(i);
                        i.onerror = reject;
                        i.src = imgUrl;
                    });
                    const canvas = processImage(img, nativeImg, molduraImg);
                    progressView.innerHTML = '';
                    progressView.appendChild(canvas);
                    URL.revokeObjectURL(imgUrl);
                } catch (e) {
                    progressView.innerHTML = '<p class="text-red-500 text-[10px] font-bold">ERRO</p>';
                }
            };

            imageInput.addEventListener('change', () => {
                const count = imageInput.files.length;
                imagesPreviewText.textContent = count > 0 ? `${count} selecionada(s)` : 'Selecionar Fotos';
                imagesPreviewText.classList.toggle('text-blue-600', count > 0);
                convertButton.disabled = !(assetsLoaded && count > 0);
                refreshPreview();
            });

            convertButton.addEventListener('click', async () => {
                if (!assetsLoaded || imageInput.files.length === 0) return;
                convertButton.disabled = true;
                convertButton.textContent = 'PROCESSANDO...';
                
                for (let i = 0; i < imageInput.files.length; i++) {
                    const fileUrl = URL.createObjectURL(imageInput.files[i]);
                    const img = await new Promise((resolve, reject) => {
                        const i = new Image();
                        i.onload = () => resolve(i);
                        i.onerror = reject;
                        i.src = fileUrl;
                    });
                    const canvas = processImage(img, nativeImg, molduraImg);
                    const link = document.createElement('a');
                    link.href = canvas.toDataURL('image/jpeg', 0.38);
                    link.download = `Foto_${Date.now()}_${i+1}.jpg`;
                    link.click();
                    URL.revokeObjectURL(fileUrl);
                    await new Promise(r => setTimeout(r, 300));
                }
                
                document.getElementById('successModal')?.classList.remove('hidden');
                convertButton.disabled = false;
                convertButton.textContent = 'PROCESSAR E COMPRIMIR';
            });
        });
    </script>
</body>
</html>
