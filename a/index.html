<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personalizador | Festa Net Brasil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .custom-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        .drop-zone {
            transition: all 0.2s ease;
            border: 2px dashed #cbd5e1;
            background-color: #ffffff;
        }
        .drop-zone:active {
            transform: scale(0.98);
            border-color: #3b82f6;
        }
        
        .view-wrapper {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            aspect-ratio: 1984 / 1100;
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e2e8f0;
        }

        #progressView canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .hidden-input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-10">

    <div class="w-full max-w-2xl bg-white rounded-3xl custom-shadow overflow-hidden border border-slate-100">
        <header class="p-6 border-b flex flex-col items-center bg-white">
            <h1 class="text-xl font-bold text-slate-800">Personalizador de Fotos</h1>
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">Compressão Máxima (Alvo 100KB)</p>
        </header>

        <main class="p-6 md:p-8 space-y-8">
            
            <!-- Status dos Assets -->
            <div class="grid grid-cols-2 gap-4">
                <div id="statusNative" class="bg-slate-50 rounded-xl p-3 flex items-center space-x-3 border border-slate-200">
                    <div class="loader !w-4 !h-4 !border-slate-300 !border-t-blue-500"></div>
                    <div class="text-xs">
                        <p class="font-bold text-slate-700">Marca Nativa</p>
                        <p class="text-slate-500">Carregando...</p>
                    </div>
                </div>
                <div id="statusMoldura" class="bg-slate-50 rounded-xl p-3 flex items-center space-x-3 border border-slate-200">
                    <div class="loader !w-4 !h-4 !border-slate-300 !border-t-purple-500"></div>
                    <div class="text-xs">
                        <p class="font-bold text-slate-700">Moldura</p>
                        <p class="text-slate-500">Carregando...</p>
                    </div>
                </div>
            </div>

            <!-- Upload apenas das fotos -->
            <div class="space-y-2">
                <label class="text-[11px] font-bold text-slate-500 uppercase ml-1">Fotos para Personalizar</label>
                <label for="images" class="drop-zone flex flex-col items-center justify-center p-4 rounded-2xl cursor-pointer h-32 hover:bg-slate-50 transition-colors">
                    <i data-lucide="image-plus" class="w-8 h-8 text-blue-500 mb-2"></i>
                    <span id="imagesPreviewText" class="text-xs font-bold text-slate-600 text-center">Selecionar Fotos</span>
                    <input type="file" id="images" class="hidden-input" accept="image/*" multiple>
                </label>
            </div>

            <!-- Preview Area -->
            <div id="previewArea" class="hidden space-y-3">
                <div class="flex justify-between items-center px-1">
                    <span class="text-[11px] font-bold text-slate-500 uppercase flex items-center">
                        <i data-lucide="eye" class="w-4 h-4 mr-2"></i> Preview
                    </span>
                    <span class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-md font-bold">~120 KB</span>
                </div>
                <div id="progressView" class="view-wrapper"></div>
            </div>

            <!-- Botão -->
            <button id="convertButton" disabled class="w-full bg-slate-900 hover:bg-black text-white font-bold py-5 rounded-2xl shadow-xl transition-all flex items-center justify-center space-x-3 text-lg disabled:bg-slate-300 disabled:cursor-not-allowed">
                <i data-lucide="zap" class="w-6 h-6 text-yellow-400"></i>
                <span>PROCESSAR E COMPRIMIR</span>
            </button>
        </main>

        <footer class="bg-slate-50 p-4 text-center border-t border-slate-100">
            <p class="text-[10px] text-slate-400 font-bold">© 2025 - REDUÇÃO DE ATÉ 75% NO PESO</p>
        </footer>
    </div>

    <!-- Modal Sucesso -->
    <div id="successModal" class="fixed inset-0 bg-slate-900/80 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-5">
                <i data-lucide="check" class="w-10 h-10"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800">Concluído!</h2>
            <p class="text-slate-500 mt-2 text-sm leading-relaxed">Suas imagens foram processadas com compressão máxima.</p>
            <button onclick="closeModal()" class="mt-8 w-full py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-black transition-transform active:scale-95">FECHAR</button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        document.addEventListener("DOMContentLoaded", async () => {
            const imageInput = document.getElementById('images');
            const progressView = document.getElementById('progressView');
            const previewArea = document.getElementById('previewArea');
            const imagesPreviewText = document.getElementById('imagesPreviewText');
            const convertButton = document.getElementById('convertButton');
            const successModal = document.getElementById('successModal');

            // ASSETS NA RAIZ - Caminho correto baseado no debug
            const ASSETS = {
                NATIVE: './native.webp',
                MOLDURA: './moldura.png'
            };

            let nativeImg = null;
            let molduraImg = null;
            let assetsLoaded = false;

            const loadImage = (url) => new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('Erro ao carregar: ' + url));
                img.src = url + '?v=' + Date.now();
            });

            // CARREGAR ASSETS AUTOMATICAMENTE
            const carregarAssets = async () => {
                try {
                    [nativeImg, molduraImg] = await Promise.all([
                        loadImage(ASSETS.NATIVE),
                        loadImage(ASSETS.MOLDURA)
                    ]);
                    
                    assetsLoaded = true;
                    
                    // Atualiza UI - Nativa
                    const statusNative = document.getElementById('statusNative');
                    statusNative.className = 'bg-blue-50 rounded-xl p-3 flex items-center space-x-3 border border-blue-200';
                    statusNative.innerHTML = `
                        <i data-lucide="check-circle" class="w-4 h-4 text-blue-500"></i>
                        <div class="text-xs">
                            <p class="font-bold text-blue-700">Marca Nativa</p>
                            <p class="text-blue-600">${nativeImg.width}×${nativeImg.height}px</p>
                        </div>
                    `;
                    
                    // Atualiza UI - Moldura
                    const statusMoldura = document.getElementById('statusMoldura');
                    statusMoldura.className = 'bg-purple-50 rounded-xl p-3 flex items-center space-x-3 border border-purple-200';
                    statusMoldura.innerHTML = `
                        <i data-lucide="check-circle" class="w-4 h-4 text-purple-500"></i>
                        <div class="text-xs">
                            <p class="font-bold text-purple-700">Moldura</p>
                            <p class="text-purple-600">${molduraImg.width}×${molduraImg.height}px</p>
                        </div>
                    `;
                    
                    lucide.createIcons();
                    checkReady();
                    
                } catch (error) {
                    console.error('Erro:', error);
                    document.getElementById('statusNative').className = 'bg-red-50 rounded-xl p-3 border border-red-200';
                    document.getElementById('statusNative').innerHTML = '<p class="text-xs text-red-600 font-bold">Erro na Marca</p>';
                    document.getElementById('statusMoldura').className = 'bg-red-50 rounded-xl p-3 border border-red-200';
                    document.getElementById('statusMoldura').innerHTML = '<p class="text-xs text-red-600 font-bold">Erro na Moldura</p>';
                }
            };

            await carregarAssets();

            const checkReady = () => {
                convertButton.disabled = !(assetsLoaded && imageInput.files.length > 0);
            };

            // LÓGICA EXATA DO SEU CÓDIGO ORIGINAL
            const processImage = (image, nativeWatermark, userWatermark) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const targetWidth = 1984;
                const targetHeight = 1100;
                canvas.width = targetWidth;
                canvas.height = targetHeight;

                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';

                const imgRatio = image.width / image.height;
                const targetRatio = targetWidth / targetHeight;
                let newWidth, newHeight;

                if (imgRatio > targetRatio) {
                    newWidth = image.width / (image.height / targetHeight);
                    newHeight = targetHeight;
                } else {
                    newWidth = targetWidth;
                    newHeight = image.height / (image.width / targetWidth);
                }
                
                // Foto do usuário (fundo)
                ctx.drawImage(image, (targetWidth - newWidth) / 2, (targetHeight - newHeight) / 2, newWidth, newHeight);

                // MOLDURA (userWatermark) - centro horizontal, bottom
                if (userWatermark) {
                    ctx.drawImage(userWatermark, (targetWidth - userWatermark.width) / 2, targetHeight - userWatermark.height);
                }

                // MARCA NATIVA (nativeWatermark) - centro exato
                if (nativeWatermark) {
                    ctx.drawImage(nativeWatermark, (targetWidth - nativeWatermark.width) / 2, (targetHeight - nativeWatermark.height) / 2);
                }

                return canvas;
            };

            const refreshPreview = async () => {
                if (!assetsLoaded || imageInput.files.length === 0) {
                    previewArea.classList.add('hidden');
                    return;
                }

                try {
                    previewArea.classList.remove('hidden');
                    progressView.innerHTML = '<div class="loader"></div>';
                    
                    const imgUrl = URL.createObjectURL(imageInput.files[0]);
                    const img = await loadImage(imgUrl);
                    
                    // nativeImg = marca (centro), molduraImg = moldura (bottom)
                    const canvas = processImage(img, nativeImg, molduraImg);
                    
                    progressView.innerHTML = '';
                    progressView.appendChild(canvas);
                    URL.revokeObjectURL(imgUrl);
                } catch (e) {
                    progressView.innerHTML = '<p class="text-red-500 text-[10px] font-bold">ERRO NO ARQUIVO</p>';
                }
            };

            imageInput.addEventListener('change', () => {
                const count = imageInput.files.length;
                imagesPreviewText.textContent = count > 0 ? `${count} selecionada(s)` : 'Selecionar Fotos';
                imagesPreviewText.classList.toggle('text-blue-600', count > 0);
                checkReady();
                refreshPreview();
            });

            convertButton.addEventListener('click', async () => {
                if (!assetsLoaded || imageInput.files.length === 0) return;

                convertButton.disabled = true;
                const oldHTML = convertButton.innerHTML;
                convertButton.innerHTML = `<div class="loader !w-5 !h-5 !border-white !border-t-transparent"></div> <span>COMPRIMINDO...</span>`;

                try {
                    const files = Array.from(imageInput.files);

                    for (let i = 0; i < files.length; i++) {
                        const fileUrl = URL.createObjectURL(files[i]);
                        const img = await loadImage(fileUrl);
                        const canvas = processImage(img, nativeImg, molduraImg);
                        
                        const link = document.createElement('a');
                        link.href = canvas.toDataURL('image/jpeg', 0.38); 
                        link.download = `FestaNet_Mini_${Date.now()}_${i+1}.jpg`;
                        link.click();
                        
                        URL.revokeObjectURL(fileUrl);
                        await new Promise(r => setTimeout(r, 300));
                    }
                    
                    successModal.classList.remove('hidden');
                } catch (e) {
                    alert('Erro ao processar: ' + e.message);
                } finally {
                    convertButton.disabled = false;
                    convertButton.innerHTML = oldHTML;
                }
            });
        });

        function closeModal() {
            document.getElementById('successModal').classList.add('hidden');
        }
    </script>
</body>
</html>
