<!DOCTYPE html>
<html>
<head>
    <title>Teste CORS</title>
</head>
<body>
    <h1>Teste de CORS</h1>
    <div id="resultado"></div>
    
    <script>
        const url = 'https://sou.net.br/midiatotal/app/marcas/teste-imagem.php';
        const div = document.getElementById('resultado');
        
        // Teste 1: Fetch com CORS
        fetch(url, {mode: 'cors'})
            .then(r => {
                div.innerHTML += `<p style="color:green">✅ Fetch OK: ${r.status}</p>`;
                return r.blob();
            })
            .then(b => {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(b);
                img.style.maxWidth = '300px';
                img.style.border = '2px solid green';
                div.appendChild(img);
            })
            .catch(e => {
                div.innerHTML += `<p style="color:red">❌ Fetch Erro: ${e.message}</p>`;
            });
            
        // Teste 2: Imagem direta
        const img2 = document.createElement('img');
        img2.src = url;
        img2.style.maxWidth = '300px';
        img2.style.border = '2px solid blue';
        img2.onload = () => div.innerHTML += '<p style="color:green">✅ Img.onload OK</p>';
        img2.onerror = () => div.innerHTML += '<p style="color:red">❌ Img.onerror</p>';
        div.appendChild(img2);
    </script>
</body>
</html>
