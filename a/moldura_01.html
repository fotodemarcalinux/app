<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizador | Moldura 01</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .view-wrapper { width: 100%; aspect-ratio: 1984/1100; background: #1e293b; 
                       border-radius: 12px; overflow: hidden; position: relative; }
        canvas { width: 100% !important; height: auto !important; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; 
                 border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
        
        <header class="p-6 border-b text-center">
            <h1 class="text-xl font-bold text-slate-800">Personalizador - Moldura 01</h1>
            <p class="text-xs text-slate-400 uppercase tracking-widest mt-1">GitHub Pages Edition</p>
        </header>

        <main class="p-6 space-y-6">
            
            <!-- Status da Moldura -->
            <div id="statusMoldura" class="bg-blue-50 border border-blue-200 rounded-xl p-4 flex items-center space-x-3">
                <div class="loader !w-5 !h-5 !border-blue-200 !border-t-blue-500"></div>
                <div>
                    <p class="text-sm font-bold text-blue-800">Carregando moldura...</p>
                    <p class="text-xs text-blue-600">sou.net.br</p>
                </div>
            </div>

            <!-- Upload -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500 uppercase">Suas Fotos</label>
                <label for="images" class="flex flex-col items-center justify-center p-6 border-2 border-dashed border-slate-300 rounded-2xl cursor-pointer hover:bg-slate-50 transition-colors h-32">
                    <i data-lucide="image-plus" class="w-8 h-8 text-blue-500 mb-2"></i>
                    <span id="imagesPreviewText" class="text-sm font-bold text-slate-600">Selecionar Fotos</span>
                    <input type="file" id="images" class="hidden" accept="image/*" multiple>
                </label>
            </div>

            <!-- Preview -->
            <div id="previewArea" class="hidden space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-500 uppercase">Preview</span>
                    <span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded font-bold">~120 KB</span>
                </div>
                <div id="progressView" class="view-wrapper flex items-center justify-center">
                    <div class="loader"></div>
                </div>
            </div>

            <!-- Botão -->
            <button id="convertButton" disabled class="w-full bg-slate-900 disabled:bg-slate-300 text-white font-bold py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center space-x-2">
                <i data-lucide="zap" class="w-5 h-5 text-yellow-400"></i>
                <span>PROCESSAR E BAIXAR</span>
            </button>

        </main>
    </div>

    <!-- Modal -->
    <div id="successModal" class="fixed inset-0 bg-slate-900/80 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="check" class="w-10 h-10"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800">Concluído!</h2>
            <button onclick="closeModal()" class="mt-6 w-full py-3 bg-slate-900 text-white rounded-2xl font-bold">FECHAR</button>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURAÇÃO
        // ============================================
        const CONFIG = {
            // Use o PHP proxy que você já criou
            MOLDURA_URL: 'https://sou.net.br/midiatotal/app/marcas/moldura.php?n=01',
            NOME_ARQUIVO: 'Moldura01'
        };

        lucide.createIcons();

        document.addEventListener("DOMContentLoaded", async () => {
            const imageInput = document.getElementById('images');
            const progressView = document.getElementById('progressView');
            const previewArea = document.getElementById('previewArea');
            const imagesPreviewText = document.getElementById('imagesPreviewText');
            const convertButton = document.getElementById('convertButton');
            const successModal = document.getElementById('successModal');
            const statusMoldura = document.getElementById('statusMoldura');

            let molduraCarregada = null;

            // ============================================
            // FUNÇÃO CORRIGIDA: Carrega imagem com CORS
            // ============================================
            const loadImage = (url) => new Promise((resolve, reject) => {
                const img = new Image();
                
                // ESSENCIAL: Definir crossOrigin ANTES do src
                img.crossOrigin = 'anonymous';
                
                img.onload = () => {
                    console.log('✅ Imagem carregada:', url);
                    resolve(img);
                };
                
                img.onerror = (e) => {
                    console.error('❌ Erro ao carregar:', url, e);
                    reject(new Error(`Falha ao carregar: ${url}`));
                };
                
                // Força refresh para evitar cache sem CORS
                const separator = url.includes('?') ? '&' : '?';
                img.src = url + separator + '_=' + Date.now();
            });

            // ============================================
            // CARREGAR MOLDURA
            // ============================================
            const carregarMoldura = async () => {
                try {
                    molduraCarregada = await loadImage(CONFIG.MOLDURA_URL);
                    
                    // Atualiza UI
                    statusMoldura.className = "bg-green-50 border border-green-200 rounded-xl p-4 flex items-center space-x-3";
                    statusMoldura.innerHTML = `
                        <i data-lucide="check-circle" class="w-6 h-6 text-green-500"></i>
                        <div>
                            <p class="text-sm font-bold text-green-800">Moldura carregada!</p>
                            <p class="text-xs text-green-600">${molduraCarregada.width}x${molduraCarregada.height}px</p>
                        </div>
                    `;
                    lucide.createIcons();
                    
                    convertButton.disabled = false;
                    
                } catch (error) {
                    statusMoldura.className = "bg-red-50 border border-red-200 rounded-xl p-4";
                    statusMoldura.innerHTML = `
                        <p class="text-sm font-bold text-red-800">❌ Erro ao carregar moldura</p>
                        <p class="text-xs text-red-600">${error.message}</p>
                        <button onclick="location.reload()" class="mt-2 px-3 py-1 bg-red-200 text-red-800 rounded text-xs font-bold">Tentar novamente</button>
                    `;
                    console.error(error);
                }
            };

            await carregarMoldura();

            // ============================================
            // PROCESSAMENTO
            // ============================================
            const processImage = (image) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const W = 1984, H = 1100;
                canvas.width = W;
                canvas.height = H;

                // Fundo preto
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, W, H);

                // Foto (cover)
                const r = Math.max(W/image.width, H/image.height);
                const nw = image.width * r;
                const nh = image.height * r;
                ctx.drawImage(image, (W-nw)/2, (H-nh)/2, nw, nh);

                // Moldura por cima
                if (molduraCarregada) {
                    ctx.drawImage(molduraCarregada, 0, 0, W, H);
                }

                return canvas;
            };

            const refreshPreview = async () => {
                if (imageInput.files.length === 0 || !molduraCarregada) return;

                try {
                    previewArea.classList.remove('hidden');
                    progressView.innerHTML = '<div class="loader"></div>';
                    
                    const img = await loadImage(URL.createObjectURL(imageInput.files[0]));
                    const canvas = processImage(img);
                    
                    progressView.innerHTML = '';
                    progressView.appendChild(canvas);
                    
                } catch (e) {
                    progressView.innerHTML = '<p class="text-red-500 text-xs font-bold">Erro no preview</p>';
                }
            };

            imageInput.addEventListener('change', () => {
                const count = imageInput.files.length;
                imagesPreviewText.textContent = count > 0 ? `${count} foto(s)` : 'Selecionar Fotos';
                imagesPreviewText.classList.toggle('text-blue-600', count > 0);
                refreshPreview();
            });

            // ============================================
            // DOWNLOAD
            // ============================================
            convertButton.addEventListener('click', async () => {
                if (!molduraCarregada || imageInput.files.length === 0) return;

                convertButton.disabled = true;
                const originalHTML = convertButton.innerHTML;
                convertButton.innerHTML = `<div class="loader !w-5 !h-5 !border-white !border-t-transparent mr-2"></div> Processando...`;

                try {
                    const files = Array.from(imageInput.files);

                    for (let i = 0; i < files.length; i++) {
                        const img = await loadImage(URL.createObjectURL(files[i]));
                        const canvas = processImage(img);
                        
                        // ESSENCIAL: toDataURL só funciona se CORS estiver OK
                        const link = document.createElement('a');
                        link.href = canvas.toDataURL('image/jpeg', 0.38);
                        link.download = `${CONFIG.NOME_ARQUIVO}_${Date.now()}_${i+1}.jpg`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        
                        await new Promise(r => setTimeout(r, 400));
                    }
                    
                    successModal.classList.remove('hidden');
                    successModal.classList.add('flex');
                    
                } catch (e) {
                    alert('Erro: ' + e.message);
                    console.error(e);
                } finally {
                    convertButton.disabled = false;
                    convertButton.innerHTML = originalHTML;
                }
            });
        });

        function closeModal() {
            document.getElementById('successModal').classList.add('hidden');
            document.getElementById('successModal').classList.remove('flex');
        }
    </script>
</body>
</html>
